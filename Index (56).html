<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fournisseurs – Club Med</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f6f5f0;
    --bg3: #eeece6;
    --text: #1a1a18;
    --text2: #6b6b67;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --accent: #1a1a18;
    --accent-fg: #ffffff;
    --info-bg: #e6f1fb;
    --info-text: #0c447c;
    --radius: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg2); color: var(--text); font-size: 14px; }

  /* LAYOUT */
  .app { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

  /* HEADER */
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
  .page-header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  .page-header p { font-size: 13px; color: var(--text2); margin-top: 3px; }

  /* TOAST */
  #toast { position: fixed; top: 20px; right: 20px; background: var(--accent); color: var(--accent-fg); padding: 10px 16px; border-radius: var(--radius); font-size: 13px; z-index: 999; display: none; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
  #toast.show { display: block; animation: slideIn 0.2s ease; }
  #toast.error { background: #a32d2d; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

  /* LOADING */
  #loading { text-align: center; padding: 48px; color: var(--text2); font-size: 13px; }
  .spinner { width: 24px; height: 24px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* CONTROLS */
  .controls { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .search-wrap { position: relative; flex: 1; min-width: 220px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text2); pointer-events: none; }
  .search-input { width: 100%; padding: 8px 10px 8px 34px; border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 13px; background: var(--bg); color: var(--text); outline: none; }
  .search-input:focus { border-color: var(--accent); }

  .filter-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .pill { padding: 5px 13px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 0.5px solid var(--border2); background: var(--bg); color: var(--text2); transition: all 0.15s; white-space: nowrap; }
  .pill.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .pill:hover:not(.active) { background: var(--bg3); }

  /* ACTIONS HEADER */
  .actions-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
  .count-text { font-size: 12px; color: var(--text2); }
  .btn-primary { display: flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-fg); border: none; border-radius: var(--radius); padding: 9px 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
  .btn-primary:hover { opacity: 0.82; }

  /* TABLE */
  .table-wrap { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 800px; }
  thead tr { background: var(--bg2); }
  thead th { padding: 10px 14px; text-align: left; font-weight: 600; font-size: 11px; color: var(--text2); border-bottom: 0.5px solid var(--border); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.4px; }
  tbody tr { border-bottom: 0.5px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg2); }
  td { padding: 10px 14px; font-size: 13px; }
  td.name { font-weight: 600; }
  td a { color: var(--info-text); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  td.muted { color: var(--text2); font-size: 12px; }

  /* BADGE */
  .badge { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .cat-mat { background: #E6F1FB; color: #0C447C; }
  .cat-equip { background: #EAF3DE; color: #27500A; }
  .cat-elec { background: #FAEEDA; color: #633806; }
  .cat-net { background: #E1F5EE; color: #085041; }
  .cat-mob { background: #EEEDFE; color: #3C3489; }
  .cat-dec { background: #FBEAF0; color: #72243E; }
  .cat-pein { background: #FCEBEB; color: #791F1F; }
  .cat-other { background: #F1EFE8; color: #444441; }

  /* ROW ACTIONS */
  .row-actions { display: flex; gap: 4px; }
  .btn-icon { border: none; background: none; cursor: pointer; padding: 5px 7px; border-radius: 6px; color: var(--text2); display: flex; align-items: center; font-size: 15px; transition: background 0.1s; }
  .btn-icon:hover { background: var(--bg3); color: var(--text); }
  .btn-icon.del:hover { background: #FCEBEB; color: #A32D2D; }

  /* EMPTY */
  .empty-row td { text-align: center; padding: 40px; color: var(--text2); }

  /* MODAL */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: var(--bg); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 28px; width: 560px; max-width: 96vw; max-height: 92vh; overflow-y: auto; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .modal-header h2 { font-size: 17px; font-weight: 600; }
  .btn-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text2); padding: 4px; line-height: 1; border-radius: 6px; }
  .btn-close:hover { background: var(--bg3); color: var(--text); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.3px; }
  .form-group input,
  .form-group select,
  .form-group textarea { padding: 8px 11px; border: 0.5px solid var(--border2); border-radius: var(--radius); font-size: 13px; background: var(--bg); color: var(--text); font-family: inherit; outline: none; }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--accent); }
  .form-group textarea { resize: vertical; min-height: 70px; }
  .form-group input.error { border-color: #A32D2D; }
  .form-error { font-size: 11px; color: #A32D2D; display: none; }
  .form-error.show { display: block; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; padding-top: 18px; border-top: 0.5px solid var(--border); }
  .btn-cancel { padding: 8px 16px; border: 0.5px solid var(--border2); background: none; border-radius: var(--radius); font-size: 13px; cursor: pointer; color: var(--text); font-family: inherit; }
  .btn-cancel:hover { background: var(--bg2); }
  .btn-save { padding: 8px 18px; background: var(--accent); color: var(--accent-fg); border: none; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .btn-save:hover:not(:disabled) { opacity: 0.82; }
  .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

  /* DELETE CONFIRM */
  .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 300; align-items: center; justify-content: center; }
  .confirm-overlay.open { display: flex; }
  .confirm-box { background: var(--bg); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 24px; width: 360px; max-width: 95vw; }
  .confirm-box h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .confirm-box p { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
  .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-danger { padding: 8px 16px; background: #a32d2d; color: #fff; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-danger:hover { background: #791F1F; }
</style>
</head>
<body>

<div id="toast"></div>

<div class="app">
  <div class="page-header">
    <div>
      <h1>📋 Fournisseurs</h1>
      <p>Gestion des contacts &amp; prestataires – Club Med</p>
    </div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" id="searchInput" placeholder="Rechercher fournisseur, produit, contact…" oninput="renderTable()">
    </div>
    <button class="btn-primary" onclick="openModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Ajouter
    </button>
  </div>

  <div class="filter-pills" id="filterPills"></div>

  <div class="actions-bar">
    <span class="count-text" id="countText"></span>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div>Chargement des données…</div>
  </div>

  <div class="table-wrap" id="tableWrap" style="display:none">
    <table>
      <thead>
        <tr>
          <th>Fournisseur</th>
          <th>Catégorie</th>
          <th>Produit / Service</th>
          <th>Contact principal</th>
          <th>Contact secondaire</th>
          <th>Téléphone</th>
          <th>Notes</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- MODAL AJOUT / MODIFICATION -->
<div class="overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle">Ajouter un fournisseur</h2>
      <button class="btn-close" onclick="closeModal()" aria-label="Fermer">✕</button>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label for="f_nom">Fournisseur *</label>
        <input type="text" id="f_nom" placeholder="Nom du fournisseur">
        <span class="form-error" id="err_nom">Ce champ est obligatoire</span>
      </div>
      <div class="form-group">
        <label for="f_cat">Catégorie</label>
        <select id="f_cat">
          <option value="">— Sélectionner —</option>
          <option>Ascenseur</option>
          <option>Automobile</option>
          <option>Contrôle d'accès</option>
          <option>Décoration</option>
          <option>Électricité</option>
          <option>Énergie</option>
          <option>Équipement</option>
          <option>Équipement extérieur</option>
          <option>Équipement ski</option>
          <option>Matériaux</option>
          <option>Mobilier</option>
          <option>Nettoyage</option>
          <option>Peinture</option>
          <option>Piscine</option>
          <option>Revêtement de sol</option>
          <option>Sanitaire</option>
          <option>Serrurerie</option>
          <option>Signalétique</option>
          <option>Vitrerie</option>
          <option>Autre</option>
        </select>
      </div>
      <div class="form-group full">
        <label for="f_produit">Produit / Service</label>
        <input type="text" id="f_produit" placeholder="Ex : Machine à laver, Peinture GM…">
      </div>
      <div class="form-group">
        <label for="f_c1">Contact principal</label>
        <input type="text" id="f_c1" placeholder="email ou téléphone">
      </div>
      <div class="form-group">
        <label for="f_c2">Contact secondaire</label>
        <input type="text" id="f_c2" placeholder="email ou téléphone">
      </div>
      <div class="form-group">
        <label for="f_tel">Téléphone</label>
        <input type="tel" id="f_tel" placeholder="04 XX XX XX XX">
      </div>
      <div class="form-group">
        <!-- spacer -->
      </div>
      <div class="form-group full">
        <label for="f_notes">Notes</label>
        <textarea id="f_notes" placeholder="Informations complémentaires, rappels…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" id="btnSave" onclick="saveEntry()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- CONFIRM SUPPRESSION -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>Supprimer ce fournisseur ?</h3>
    <p id="confirmMsg"></p>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeConfirm()">Annuler</button>
      <button class="btn-danger" id="btnConfirmDel" onclick="confirmDelete()">Supprimer</button>
    </div>
  </div>
</div>

<script>
  let allData = [];
  let editId = null;
  let deleteId = null;
  let activeFilter = "Tous";

  const CAT_COLORS = {
    "Matériaux":       "cat-mat",
    "Équipement":      "cat-equip",
    "Équipement ski":  "cat-equip",
    "Équipement extérieur": "cat-equip",
    "Électricité":     "cat-elec",
    "Énergie":         "cat-elec",
    "Nettoyage":       "cat-net",
    "Mobilier":        "cat-mob",
    "Décoration":      "cat-dec",
    "Peinture":        "cat-pein",
  };
  function badgeClass(cat){ return CAT_COLORS[cat] || "cat-other"; }

  // === TOAST ===
  function toast(msg, isError=false) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "show" + (isError ? " error" : "");
    setTimeout(() => { t.className = ""; }, 3000);
  }

  // === LOAD DATA ===
  function loadData() {
    google.script.run
      .withSuccessHandler(d => {
        if (d && d.error) { toast("Erreur : " + d.error, true); return; }
        allData = d || [];
        document.getElementById("loading").style.display = "none";
        document.getElementById("tableWrap").style.display = "block";
        renderPills();
        renderTable();
      })
      .withFailureHandler(e => {
        document.getElementById("loading").innerHTML = "❌ Impossible de charger les données.";
        toast("Erreur de chargement", true);
      })
      .getFournisseurs();
  }

  // === FILTER PILLS ===
  function renderPills() {
    const cats = ["Tous", ...[...new Set(allData.map(d => d.cat).filter(Boolean))].sort()];
    document.getElementById("filterPills").innerHTML = cats.map(c =>
      `<button class="pill${activeFilter===c?" active":""}" onclick="setFilter('${c.replace(/'/g,"\\'")}') ">${c}</button>`
    ).join("");
  }
  function setFilter(f) { activeFilter = f; renderPills(); renderTable(); }

  // === FILTER LOGIC ===
  function getFiltered() {
    const q = document.getElementById("searchInput").value.toLowerCase().trim();
    return allData.filter(d => {
      const matchCat = activeFilter === "Tous" || d.cat === activeFilter;
      const matchQ = !q || [d.nom, d.produit, d.cat, d.c1, d.c2, d.tel, d.notes]
        .some(v => v && String(v).toLowerCase().includes(q));
      return matchCat && matchQ;
    });
  }

  // === RENDER TABLE ===
  function renderTable() {
    const filtered = getFiltered();
    document.getElementById("countText").textContent =
      `${filtered.length} fournisseur${filtered.length !== 1 ? "s" : ""}`;
    const tbody = document.getElementById("tableBody");
    if (!filtered.length) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="8">Aucun fournisseur trouvé</td></tr>`;
      return;
    }
    tbody.innerHTML = filtered.map(d => `
      <tr>
        <td class="name">${esc(d.nom)}</td>
        <td>${d.cat ? `<span class="badge ${badgeClass(d.cat)}">${esc(d.cat)}</span>` : "—"}</td>
        <td>${esc(d.produit) || "—"}</td>
        <td>${d.c1 ? `<a href="mailto:${esc(d.c1)}">${esc(d.c1)}</a>` : "—"}</td>
        <td class="muted">${d.c2 ? `<a href="mailto:${esc(d.c2)}">${esc(d.c2)}</a>` : "—"}</td>
        <td>${esc(d.tel) || "—"}</td>
        <td class="muted" style="font-style:italic">${esc(d.notes) || ""}</td>
        <td>
          <div class="row-actions">
            <button class="btn-icon" onclick="editEntry(${d.id})" title="Modifier" aria-label="Modifier ${esc(d.nom)}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
            </button>
            <button class="btn-icon del" onclick="askDelete(${d.id}, '${esc(d.nom).replace(/'/g,"\\'")}' )" title="Supprimer" aria-label="Supprimer ${esc(d.nom)}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </td>
      </tr>
    `).join("");
  }

  function esc(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // === MODAL ADD / EDIT ===
  function openModal(id = null) {
    editId = id;
    document.getElementById("modalTitle").textContent = id ? "Modifier le fournisseur" : "Ajouter un fournisseur";
    document.getElementById("err_nom").classList.remove("show");
    document.getElementById("f_nom").classList.remove("error");
    if (id) {
      const d = allData.find(x => String(x.id) === String(id));
      if (d) {
        document.getElementById("f_nom").value = d.nom || "";
        document.getElementById("f_cat").value = d.cat || "";
        document.getElementById("f_produit").value = d.produit || "";
        document.getElementById("f_c1").value = d.c1 || "";
        document.getElementById("f_c2").value = d.c2 || "";
        document.getElementById("f_tel").value = d.tel || "";
        document.getElementById("f_notes").value = d.notes || "";
      }
    } else {
      ["f_nom","f_produit","f_c1","f_c2","f_tel","f_notes"].forEach(i => document.getElementById(i).value = "");
      document.getElementById("f_cat").value = "";
    }
    document.getElementById("modalOverlay").classList.add("open");
    setTimeout(() => document.getElementById("f_nom").focus(), 80);
  }

  function closeModal() {
    document.getElementById("modalOverlay").classList.remove("open");
    editId = null;
  }

  function saveEntry() {
    const nom = document.getElementById("f_nom").value.trim();
    if (!nom) {
      document.getElementById("f_nom").classList.add("error");
      document.getElementById("err_nom").classList.add("show");
      document.getElementById("f_nom").focus();
      return;
    }
    const entry = {
      id: editId,
      nom: nom,
      cat: document.getElementById("f_cat").value,
      produit: document.getElementById("f_produit").value.trim(),
      c1: document.getElementById("f_c1").value.trim(),
      c2: document.getElementById("f_c2").value.trim(),
      tel: document.getElementById("f_tel").value.trim(),
      notes: document.getElementById("f_notes").value.trim()
    };
    const btn = document.getElementById("btnSave");
    btn.disabled = true;
    btn.textContent = "Enregistrement…";

    const fn = editId ? "updateFournisseur" : "addFournisseur";
    google.script.run
      .withSuccessHandler(r => {
        btn.disabled = false; btn.textContent = "Enregistrer";
        if (r && r.error) { toast("Erreur : " + r.error, true); return; }
        toast(editId ? "Fournisseur modifié ✓" : "Fournisseur ajouté ✓");
        closeModal();
        loadData();
      })
      .withFailureHandler(e => {
        btn.disabled = false; btn.textContent = "Enregistrer";
        toast("Erreur lors de l'enregistrement", true);
      })
      [fn](entry);
  }

  function editEntry(id) { openModal(id); }

  // === DELETE ===
  function askDelete(id, nom) {
    deleteId = id;
    document.getElementById("confirmMsg").textContent = `Cette action supprimera définitivement "${nom}".`;
    document.getElementById("confirmOverlay").classList.add("open");
  }
  function closeConfirm() {
    document.getElementById("confirmOverlay").classList.remove("open");
    deleteId = null;
  }
  function confirmDelete() {
    if (!deleteId) return;
    const btn = document.getElementById("btnConfirmDel");
    btn.disabled = true; btn.textContent = "Suppression…";
    google.script.run
      .withSuccessHandler(r => {
        btn.disabled = false; btn.textContent = "Supprimer";
        if (r && r.error) { toast("Erreur : " + r.error, true); return; }
        toast("Fournisseur supprimé");
        closeConfirm();
        loadData();
      })
      .withFailureHandler(() => {
        btn.disabled = false; btn.textContent = "Supprimer";
        toast("Erreur lors de la suppression", true);
      })
      .deleteFournisseur(deleteId);
  }

  // === KEYBOARD / CLICK OUTSIDE ===
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeModal(); closeConfirm(); }
  });
  document.getElementById("modalOverlay").addEventListener("click", function(e) {
    if (e.target === this) closeModal();
  });
  document.getElementById("confirmOverlay").addEventListener("click", function(e) {
    if (e.target === this) closeConfirm();
  });

  // INIT
  loadData();
</script>
</body>
</html>
